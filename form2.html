<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bot Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 400px;
            margin: 10px auto;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            display: block;
            margin-bottom: 4px;
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        .required:after {
            content: '*';
            color: red;
            margin-left: 4px;
        }
        .optional {
            font-size: 0.8em;
            color: #777;
        }
        .submit-button {
            width: 100%;
            padding: 12px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        .submit-button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="font-size: 18px; margin-bottom: 15px;">Invoice Form</h1>
        <form action="/submit-form" method="post">
            <div class="form-group">
                <label for="invoiceNumber" class="required">Invoice Number</label>
                <input type="text" id="invoiceNumber" name="invoiceNumber" required>
            </div>

            <div class="form-group">
                <label for="invoiceDate" class="required">Invoice Date</label>
                <input type="date" id="invoiceDate" name="invoiceDate" required>
            </div>

            <div class="form-group">
                <label for="vendorNumber" class="required">Vendor Number</label>
                <input type="text" id="vendorNumber" name="vendorNumber" required>
            </div>

            <div class="form-group">
                <label for="poNumber" class="optional">PO Number (optional)</label>
                <input type="text" id="poNumber" name="poNumber">
            </div>

            <button type="submit" class="submit-button">Submit</button>
        </form>
    </div>
</body>
</html>
