<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bot Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 300px; /* Reduced width by 25% */
            margin: 10px auto;
            padding: 11px; /* Reduced padding by 25% */
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 9px; /* Reduced spacing by 25% */
        }
        .form-group label {
            display: block;
            margin-bottom: 3px; /* Reduced label spacing */
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 7.5px; /* Reduced input padding */
            box-sizing: border-box;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        .required:after {
            content: '*';
            color: red;
            margin-left: 4px;
        }
        .optional {
            font-size: 0.8em;
            color: #777;
        }
        .submit-button {
            width: 100%;
            padding: 9px; /* Reduced button size */
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        .submit-button:hover {
            background-color: #0056b3;
        }
        .submission-message {
            display: none;
            color: black;
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="font-size: 18px; margin-bottom: 15px;">Invoice Form</h1>
        <form id="invoiceForm">
            <div class="form-group">
                <label for="invoiceNumber" class="required">Invoice Number</label>
                <input type="text" id="invoiceNumber" name="invoiceNumber" required>
            </div>

            <div class="form-group">
                <label for="invoiceDate" class="required">Invoice Date</label>
                <input type="date" id="invoiceDate" name="invoiceDate" required>
            </div>

            <div class="form-group">
                <label for="vendorNumber" class="required">Vendor Number</label>
                <input type="text" id="vendorNumber" name="vendorNumber" required>
            </div>

            <div class="form-group">
                <label for="poNumber" class="optional">PO Number (optional)</label>
                <input type="text" id="poNumber" name="poNumber">
            </div>

            <button type="button" class="submit-button" id="submit-btn">Submit</button>
        </form>
        <div class="submission-message">Thank you for your submission!</div>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script>
        $(function() {
            $("#submit-btn").click(function() {
                // Prevent Cross-Site Scripting (XSS) by escaping input
                function sanitizeInput(input) {
                    return $('<div/>').text(input).html();
                }

                // Retrieve and sanitize form data
                var invoiceNumber = sanitizeInput($("#invoiceNumber").val().trim());
                var invoiceDate = sanitizeInput($("#invoiceDate").val().trim());
                var vendorNumber = sanitizeInput($("#vendorNumber").val().trim());
                var poNumber = sanitizeInput($("#poNumber").val().trim());

                // Validate required fields
                if (invoiceNumber === '' || invoiceDate === '' || vendorNumber === '') {
                    alert('Please fill in all required fields.');
                    return;
                }

                // Simple validation for Invoice and Vendor Numbers (assuming they are alphanumeric)
                var numberPattern = /^[a-zA-Z0-9]+$/;
                if (!numberPattern.test(invoiceNumber)) {
                    alert('Please enter a valid Invoice Number.');
                    return;
                }
                if (!numberPattern.test(vendorNumber)) {
                    alert('Please enter a valid Vendor Number.');
                    return;
                }

                // Send form data via postMessage (with sanitized input)
                window.parent.postMessage(JSON.stringify({
                    event_code: 'ym-client-event',
                    data: JSON.stringify({
                        event: {
                            code: "invoicedetails",
                            data: {
                                invoiceNumber: invoiceNumber,
                                invoiceDate: invoiceDate,
                                vendorNumber: vendorNumber,
                                poNumber: poNumber
                            }
                        }
                    })
                }), '*');

                // Hide the form and show thank you message
                $("#submit-btn").fadeOut("slow", function() {
                    $(".submission-message").fadeIn("slow");
                });
            });
        });
    </script>
</body>
</html>
